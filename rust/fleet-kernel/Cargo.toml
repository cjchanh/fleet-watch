[package]
name = "fleet-kernel"
version = "0.1.0"
edition = "2021"
description = "Fleet Watch governance kernel (Rust port). PS-A: Decision contract + pure path-overlap helpers, parity-tested against fleet_watch.referee."

# Empty workspace table: this crate is a standalone leaf inside the (Python)
# fleet-watch repo. Declaring it here stops cargo from searching upward for a
# parent workspace it would never find.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
