[package]
name = "fleet-kernel"
version = "0.1.0"
edition = "2021"
description = "Fleet Watch governance kernel (Rust port). Decision contract + path-overlap helpers + scope normalization + hash-chain ledger + read-only registry checks, parity-tested against fleet_watch."

# Empty workspace table: this crate is a standalone leaf inside the (Python)
# fleet-watch repo. Declaring it here stops cargo from searching upward for a
# parent workspace it would never find.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
